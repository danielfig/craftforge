<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Grass/Oak Crafting Block Background -->
  <rect width="16" height="16" fill="#6b4423"/>
  <rect x="0" y="0" width="16" height="4" fill="#59983b"/>
  <rect x="0" y="3" width="16" height="1" fill="#467c2d"/>
  <rect x="2" y="4" width="2" height="1" fill="#59983b"/>
  <rect x="7" y="4" width="3" height="1" fill="#467c2d"/>
  <rect x="13" y="4" width="2" height="1" fill="#59983b"/>
  <!-- Dirt texture specks -->
  <rect x="1" y="6" width="2" height="2" fill="#59361a"/>
  <rect x="12" y="7" width="2" height="2" fill="#59361a"/>
  <rect x="3" y="12" width="2" height="2" fill="#7c522e"/>
  <rect x="10" y="13" width="2" height="2" fill="#59361a"/>
  <!-- Outer dark pixel frame -->
  <rect x="0" y="0" width="16" height="1" fill="#2d4f1e"/>
  <rect x="0" y="15" width="16" height="1" fill="#3a2310"/>
  <rect x="0" y="0" width="1" height="16" fill="#3a2310" opacity="0.35"/>
  <rect x="15" y="0" width="1" height="16" fill="#3a2310" opacity="0.35"/>
  <!-- Diamond Sword Emblem -->
  <!-- Blade tip -->
  <rect x="12" y="2" width="2" height="2" fill="#4aedf9"/>
  <rect x="11" y="3" width="2" height="2" fill="#33d4e8"/>
  <rect x="10" y="4" width="2" height="2" fill="#4aedf9"/>
  <rect x="9" y="5" width="2" height="2" fill="#23b5cc"/>
  <rect x="8" y="6" width="2" height="2" fill="#4aedf9"/>
  <rect x="7" y="7" width="2" height="2" fill="#23b5cc"/>
  <rect x="6" y="8" width="2" height="2" fill="#33d4e8"/>
  <!-- Highlight glint -->
  <rect x="12" y="2" width="1" height="1" fill="#d9ffff"/>
  <rect x="10" y="4" width="1" height="1" fill="#d9ffff"/>
  <rect x="8" y="6" width="1" height="1" fill="#d9ffff"/>
  <!-- Guard (gold) -->
  <rect x="4" y="7" width="2" height="2" fill="#f7c844"/>
  <rect x="7" y="10" width="2" height="2" fill="#f7c844"/>
  <rect x="5" y="9" width="2" height="2" fill="#d49b1a"/>
  <!-- Handle & pommel -->
  <rect x="4" y="10" width="2" height="2" fill="#5c3618"/>
  <rect x="3" y="11" width="2" height="2" fill="#42240d"/>
  <rect x="2" y="12" width="2" height="2" fill="#f7c844"/>
</svg>
